<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тіркелу — AccessMap</title><link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header"><div class="container nav"><a class="logo" href="index.html">✦ Access<span>Map</span></a><nav class="links" id="navLinks"><a href="index.html">Басты бет</a><a href="map.html">Нысандар картасы</a><a href="login.html">Кіру</a><a class="button small" href="register.html">Тіркелу</a></nav><button class="menu" id="menuBtn" aria-label="Мәзірді ашу" aria-expanded="false">☰</button></div></header>
  <main class="auth-section"><div class="auth-card"><span class="eyebrow">AccessMap қауымдастығы</span><h1>Аккаунт ашу</h1><p>Бұл — тіркелу формасының демонстрациялық үлгісі.</p>
    <form id="registerForm" class="form">
      <label for="name">Аты-жөні</label><input id="name" type="text" minlength="2" placeholder="Аты-жөніңіз" autocomplete="name" required>
      <label for="email">Электрондық пошта</label><input id="email" type="email" placeholder="example@mail.com" autocomplete="email" required>
      <label for="password">Құпия сөз</label><input id="password" type="password" minlength="8" placeholder="Кемінде 8 таңба" autocomplete="new-password" required>
      <label for="confirm">Құпия сөзді қайталау</label><input id="confirm" type="password" minlength="8" placeholder="Құпия сөзді қайта енгізіңіз" autocomplete="new-password" required>
      <button class="button full" type="submit">Тіркелуді тексеру</button><p class="form-message" id="formMessage" role="status" aria-live="polite"></p>
    </form><p class="auth-bottom">Аккаунтыңыз бар ма? <a href="login.html">Кіру</a></p><p class="hint">Бұл бет деректерді сақтамайды. Нақты тіркелу PHP/MySQL кезеңінде жасалады.</p>
  </div></main>
  <footer class="footer"><div class="container">© 2026 AccessMap · Оқу жобасы</div></footer>
  <script src="app.js"></script>
</body>
</html>
